<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión – Proyecto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="login-wrapper">
    <div class="login-card">

        <div class="login-logo">Pro<span>yecto</span></div>
        <p class="login-subtitle">Iniciar Sesión</p>

        <div id="loginError" class="login-error" style="display:none;"></div>

        <form id="loginForm" novalidate>
            <div class="mb-3">
                <label for="loginEmail" class="form-label">Correo electrónico</label>
                <input type="email" id="loginEmail" class="form-control"
                       placeholder="usuario@ejemplo.com" autocomplete="email" required>
            </div>
            <div class="mb-4">
                <label for="loginPassword" class="form-label">Contraseña</label>
                <input type="password" id="loginPassword" class="form-control"
                       placeholder="••••••••" autocomplete="current-password" required>
            </div>
            <button type="submit" id="btnLogin" class="btn-login">Iniciar sesión</button>
            <div class="mt-3 text-end">
                <p class="login-subtitle" style="font-size:.9rem;">
                    ¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a>
                </p>
            </div>
        </form>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
