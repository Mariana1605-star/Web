<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro – Proyecto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="login-wrapper">
    <div class="login-card">

        <div class="login-logo">Regis<span>tro</span></div>
        <p class="login-subtitle">Sistema de gestión</p>

        <div id="registerError" class="login-error" style="display:none;"></div>

        <form id="registerForm" novalidate>
            <div class="mb-3">
                <label for="regNombre" class="form-label">Nombre completo</label>
                <input type="text" id="regNombre" class="form-control"
                       placeholder="Tu nombre" required>
            </div>
            <div class="mb-3">
                <label for="regEmail" class="form-label">Correo electrónico</label>
                <input type="email" id="regEmail" class="form-control"
                       placeholder="usuario@ejemplo.com" required>
            </div>
            <div class="mb-4">
                <label for="regPassword" class="form-label">Contraseña</label>
                <input type="password" id="regPassword" class="form-control"
                       placeholder="Mínimo 6 caracteres" required>
            </div>
            <button type="submit" class="btn-login">Crear cuenta</button>
            <div class="mt-3 text-center">
                <a href="login.html" class="link-back">¿Ya tienes cuenta? Inicia sesión</a>
            </div>
        </form>

    </div>
</div>

<script src="script.js"></script>
</body>
</html>
